{% extends "base.html" %}

{% block title %}Access Denied{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="text-align: center;">
        <div style="font-size: 4rem; margin-bottom: 1rem;">🔒</div>
        <h2 style="color: #b91c1c;">Unauthorized Access</h2>
        <p>You don't have permission to view this page. You need to be logged in to access your dashboard.</p>
        
        <div style="margin-top: 2rem; display: flex; flex-direction: column; gap: 10px;">
            <a href="{{ url_for('login') }}" class="btn">Login to Continue</a>
            <a href="{{ url_for('home') }}" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
