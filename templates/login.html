<!doctype html>
<html lang="en">
  <head>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <title>Login</title>
  </head>
  <body>
    <div class="form-container">
      <form action="{{ url_for('login') }}" method="POST" class="auth-form">
        <h2>Welcome Back</h2>
        <p>Please enter your details</p>

        <div class="input-group">
          {{ form.email.label }} {{ form.email(placeholder="Enter your email")
          }}
        </div>

        <div class="input-group">
          {{ form.password.label }} {{ form.password(placeholder="Enter password") }}
        </div>

        {{ form.submit(class="btn") }}
        <p class="switch-text">
          Don't have an account? <a href="{{ url_for('register') }}">Sign up</a>
        </p>
      </form>
    </div>
  </body>
</html>
